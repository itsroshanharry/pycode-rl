[project]
name = "pycode-env"
version = "0.2.1"
description = "Python function-implementation tasks graded by hidden pytest suites in a Prime sandbox."
readme = "README.md"
tags = ["code", "single-turn", "execution", "v1"]
requires-python = ">=3.11"
# Floor = the verifiers bundled in Prime's hosted-eval runner (prime-rl 3bd59c1 ->
# verifiers 20c549f, reported as 0.4.1.dev150). A higher floor would make the runner
# upgrade verifiers from PyPI; >=0.2.0 is what classifies the package as v1 on the Hub.
dependencies = [
    "verifiers>=0.4.1.dev150",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pycode_env"]
